<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warranty Report</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Warranty Report</h1>

    <!-- SR-1: MITS staff set the warning days -->
    <section id="settings">
      <h2>Warning Days</h2>
      <label for="warningDays">Days before expiry to warn (separate with commas):</label>
      <input type="text" id="warningDays" />
      <button id="saveDaysBtn">Save</button>
      <p id="settingsMessage"></p>
    </section>

    <!-- SR-3: alerts for devices that reached a warning day -->
    <section id="alerts">
      <h2>Warranty Alerts</h2>
      <ul id="alertList"></ul>
    </section>

    <!-- SR-5 and SR-6: every device with its warranty status tag -->
    <section id="devices">
      <h2>All Devices</h2>
      <table>
        <thead>
          <tr>
            <th>Tag ID</th>
            <th>Device Type</th>
            <th>Serial Number</th>
            <th>Condition</th>
            <th>Warranty End Date</th>
            <th>Days Remaining</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="deviceTable"></tbody>
      </table>
    </section>

    <!-- PDF report (from the SRS performance requirements) -->
    <section id="report">
      <h2>PDF Report</h2>
      <button id="downloadPdfBtn">Download PDF Report</button>
    </section>

    <script src="script.js"></script>
  </body>
</html>
