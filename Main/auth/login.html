<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in | WJC MITS</title><link rel="stylesheet" href="/auth/style.css"><script src="/auth/form.js" defer></script></head>
<body data-auth-mode="login"><main class="auth-card"><p class="brand">WJC MITS</p><h1>Welcome back</h1><p>Log in to manage IT assets, loans, and maintenance.</p><p id="message" role="status" aria-live="polite" hidden></p>
<form id="auth-form"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" maxlength="254" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" maxlength="128" required><button id="submit" type="submit">Log in</button></form>
<p class="footnote">Need an account? <a href="/signup">Sign up</a></p><p class="hint">Sessions expire after 15 minutes of inactivity.</p></main></body></html>
