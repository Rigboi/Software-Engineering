<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign up | WJC MITS</title><link rel="stylesheet" href="/auth/style.css"><script src="/auth/form.js" defer></script></head>
<body data-auth-mode="signup"><main class="auth-card"><p class="brand">WJC MITS</p><h1 id="heading">Create your account</h1><p id="intro">Set up your staff account to access asset management.</p><p id="message" role="status" aria-live="polite" hidden></p>
<form id="auth-form"><label for="name">Full name</label><input id="name" autocomplete="name" maxlength="100" required><label for="loginID">Staff ID</label><input id="loginID" type="text" inputmode="numeric" pattern="[0-9]{9}" minlength="9" maxlength="9" autocomplete="username" placeholder="e.g. 620177693" title="Enter exactly 9 digits" required><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><p class="hint">Use at least 12 characters.</p><label for="confirmation">Confirm password</label><input id="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><div id="invitation-field" hidden><label for="invitation">Staff invitation code</label><input id="invitation" autocomplete="off" maxlength="100"><p class="hint">Ask your administrator for an invitation code.</p></div><button id="submit" type="submit" disabled>Create account</button></form>
<section id="invite-panel" hidden><p>Create a single-use invitation for a staff member. Codes expire after 24 hours.</p><button id="create-invite" type="button">Create invitation code</button><label id="code-label" for="invite-code" hidden>Share this code with your staff member</label><input id="invite-code" readonly hidden><p id="invite-expiry" class="hint"></p><a href="/">Back to asset management</a></section>
<p class="footnote" id="login-link">Already registered? <a href="/login">Log in</a></p></main></body></html>
